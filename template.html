<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AyudaVital Veröffentlichungskalender</title>
<style>
:root{--bg:#FAF8F5;--ink:#1E3A34;--muted:#6b7b76;--card:#fff;--line:#e6e1d8;--gold:#B07B3A;
--reel:#a9d0f2;--kar:#dff5c2;--yt:#e3d7f5;--hse:#f3c7a8;--foto:#f6e7b8;--ad:#e8893a;--pause:#efece6}
@media (prefers-color-scheme:dark){:root{--bg:#161a19;--ink:#e8efe9;--muted:#9aa8a3;--card:#202625;--line:#2f3836;--reel:#2c4d6b;--kar:#3a5428;--yt:#463a5e;--hse:#6b3f24;--foto:#5c4c1f;--pause:#262b2a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 Inter,system-ui,Arial,sans-serif}
header{padding:20px 16px 8px;max-width:1300px;margin:auto}h1{margin:0 0 4px;font-size:22px}
.sub{color:var(--muted);font-size:13px}.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}
button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer;font:inherit}
button.on{background:var(--ink);color:var(--bg)}
.legend{display:flex;flex-wrap:wrap;gap:8px 28px;font-size:12px;color:var(--muted);margin-top:4px}.lg{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}.lg b{color:var(--ink);font-weight:600;margin-right:2px}.legend span{display:inline-flex;align-items:center;gap:5px}
.sw{width:14px;height:14px}.st-g{background:#cfd6d3;border:1.5px dashed var(--ink);background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.6) 0 3px,transparent 3px 6px)}.st-h{background:#cfd6d3}.st-v{background:#cfd6d3;opacity:.45}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}
main{max-width:1300px;margin:auto;padding:0 16px 40px}
.month{margin:22px 0}.month h2{font-size:17px;margin:0 0 8px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dow{font-size:11px;color:var(--muted);text-align:center;padding-bottom:2px}
.day{background:var(--card);border:1px solid var(--line);border-radius:12px;min-height:96px;padding:6px;position:relative;overflow:hidden}
.day.out{opacity:.35}.day.pause{background:var(--pause)}.day.today{outline:2px solid var(--gold)}
.num{font-weight:700;font-size:13px}.chip{display:block;border-radius:7px;padding:3px 5px;margin-top:4px;font-size:11.5px;line-height:1.25}
.chip small{display:block;color:var(--muted);font-size:10.5px}
.chip{border:1.5px solid transparent}
.chip.geplant{border:1.5px dashed var(--ink);background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.55) 0 6px,transparent 6px 12px)}
.chip.entwurf{border:1.5px dotted var(--gold)}
.chip.veröffentlicht{opacity:.55}
.chip.hide{display:none}.prog{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;margin-top:8px}
.prog b{font-weight:600}.pbar{display:inline-block;width:90px;height:7px;background:var(--line);border-radius:4px;vertical-align:middle;margin-left:6px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--ink)}
.badge{float:right;font-size:10px;margin-left:4px}
.Reel{background:var(--reel)}.Karussell{background:var(--kar)}.YT{background:var(--yt)}.HSE{background:var(--hse);font-weight:600}.Foto{background:var(--foto)}
.ad{position:absolute;left:0;right:0;bottom:0;height:5px;background:var(--ad)}
.st{display:block;margin-top:4px;font-size:10.5px;border:1px dashed var(--gold);color:var(--gold);border-radius:6px;padding:2px 4px}
.theme{display:block;margin-top:4px;font-size:11px;border-left:3px solid var(--gold);padding-left:5px}
.hse-view .int{display:none}
section.ramp{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:10px}
.rrow{display:grid;grid-template-columns:150px 1fr 60px;gap:8px;align-items:center;font-size:12px;margin:4px 0}
.rbar{height:12px;background:var(--gold);border-radius:6px}.goal{color:var(--muted);font-size:12px}
@media (max-width:760px){.grid{gap:3px}.day{min-height:64px;padding:3px;border-radius:8px}.chip{font-size:10px;padding:2px 3px}.chip small,.st,.theme{display:none}.rrow{grid-template-columns:110px 1fr 46px}}
</style></head><body>
<header><h1>AyudaVital · Veröffentlichungskalender</h1>
<div class="sub">Stand <span id="stand"></span> · Instagram/Facebook, YouTube/TikTok, HSE-Sendungen · Quelle: rollierender Redaktionsplan</div>
<div class="bar"><button id="b-team" class="on">Team-Sicht</button><button id="b-hse">Sicht für HSE</button><span style="width:14px"></span><span class="sub">Wer liefert:</span><button class="f on" data-w="alle">Alle</button><button class="f int" data-w="Elisabeth">Elisabeth</button><button class="f int" data-w="Vin">Vin</button><button class="f int" data-w="Volker">Volker</button></div>
<div class="legend"><div class="lg"><b>Format</b><span><i class="sw" style="background:var(--kar)"></i>Karussell</span><span><i class="sw" style="background:var(--reel)"></i>Reel</span><span><i class="sw" style="background:var(--foto)"></i>Foto/Bild</span><span><i class="sw" style="background:var(--yt)"></i>YouTube/TikTok</span><span><i class="sw" style="background:var(--hse)"></i>HSE-Sendung</span></div><div class="lg int"><b>Stand</b><span><i class="sw st-g"></i>geplant</span><span><i class="sw st-h"></i>⏱ hochgeladen</span><span><i class="sw st-v"></i>veröffentlicht</span></div></div>
<div class="prog int" id="prog"></div></header>
<main id="m"></main>
<script>
const D=/*DATA*/;document.getElementById('stand').textContent=D.stand;
const MON=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const iso=d=>d.toISOString().slice(0,10),P=s=>new Date(s+'T12:00:00');
const fmt=s=>{const d=P(s);return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'};
const cls=e=>e.k==='HSE'?'HSE':e.k==='YT/TT'?'YT':/Reel/.test(e.f)?'Reel':/Karussell/.test(e.f)?'Karussell':'Foto';
const inR=(s,a,b)=>s>=a&&s<=b;const today=iso(new Date());
function month(y,m){const first=new Date(y,m,1,12),start=new Date(first);start.setDate(1-((first.getDay()+6)%7));
let h=`<div class="month"><h2>${MON[m]} ${y}</h2><div class="grid">`+['Mo','Di','Mi','Do','Fr','Sa','So'].map(x=>`<div class="dow">${x}</div>`).join('');
for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);if(i%7===0&&i>=28&&d.getMonth()!==m)break;const s=iso(d);
const c=['day'];if(d.getMonth()!==m)c.push('out');if(inR(s,D.pause[0],D.pause[1]))c.push('pause');if(s===today)c.push('today');
let x=`<div class="${c.join(' ')}"><div class="num">${d.getDate()}</div>`;
D.themes.filter(t=>t.a===s).forEach(t=>x+=`<span class="theme">${t.t}<small class="int"> · ${t.n}</small></span>`);
D.events.filter(e=>e.d===s).forEach(e=>x+=`<span class="chip ${cls(e)} ${e.k==='HSE'?'':e.st}" data-w="${e.w}">${e.st==='eingeplant'?'<span class="badge">⏱</span>':e.st==='entwurf'?'<span class="badge">Entwurf</span>':''}${e.k==='HSE'?'':e.k+' · '}${e.t}${e.n?`<small class="int">${e.f} · ${e.n}</small>`:`<small>${e.f}</small>`}</span>`);

if(s===D.pause[0])x+=`<span class="theme">Pause bis ${fmt(D.pause[1])}</span>`;

h+=x+'</div>'}return h+'</div></div>'}
let H='';[[2026,10],[2026,11],[2027,0],[2027,1]].forEach(([y,m])=>H+=month(y,m));
document.getElementById('m').innerHTML=H;
const set=h=>{document.body.classList.toggle('hse-view',h);document.getElementById('b-hse').classList.toggle('on',h);document.getElementById('b-team').classList.toggle('on',!h)};
document.getElementById('b-hse').onclick=()=>set(true);document.getElementById('b-team').onclick=()=>set(false);

function prog(){const up=D.events.filter(e=>e.k!=='HSE'&&e.d>=today);let h='';
['Elisabeth','Vin','Volker'].forEach(w=>{const a=up.filter(e=>e.w===w),d=a.filter(e=>e.st!=='geplant'&&e.st!=='entwurf').length;
h+=`<span><b>${w}</b>: ${d} von ${a.length} kommenden Beiträgen hochgeladen<span class="pbar"><i style="width:${a.length?d/a.length*100:0}%"></i></span></span>`});
document.getElementById('prog').innerHTML=h}
prog();
document.querySelectorAll('button.f').forEach(b=>b.onclick=()=>{document.querySelectorAll('button.f').forEach(x=>x.classList.toggle('on',x===b));
const w=b.dataset.w;document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('hide',w!=='alle'&&c.dataset.w!==w&&c.dataset.w!=='HSE'))});
if(location.hash==='#hse')set(true);
</script></body></html>
